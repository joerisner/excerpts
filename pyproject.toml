[project]
name = "excerpts"
version = "0.1.0"
description = "Aggregate and revisit selected texts from books, articles, and other mediums"
readme = "README.md"
authors = [
    { name = "joerisner" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx2>=2.9.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "dirty-equals>=0.11",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]


#################
##### Tools #####
#################

[tool.coverage.html]
directory = "tests/coverage/html"

[tool.coverage.run]
branch = true
data_file = "tests/coverage/.coverage"
include = ["excerpts/*"]

[tool.coverage.xml]
output = "tests/coverage/coverage.xml"

[tool.pytest.ini_options]
addopts = [
    "--cov",
    "--cov-report=html",
    "--cov-report=xml",
    "--junitxml=tests/test_results/junit.xml",
    "--strict-config",
    "-vv"
]
cache_dir = "tests/.pytest_cache"
junit_suite_name = "excerpts"
pythonpath = ["excerpts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PT",    # flake8-pytest-style
    "ANN",   # flake8-annotations
    "S",     # flake8-bandit
    "UP",    # pyupgrade
    "I",     # isort
    "FAST",  # fastapi
    "N"      # pep8-naming
]
ignore = ["ANN401"]  # allow use of `Any` type

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",  # ignore `annotation` rules for test files
    "S101"  # allow `assert` in tests
]

[tool.fastapi]
entrypoint = "excerpts.main:app"
