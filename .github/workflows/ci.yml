name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: install project
        run: uv sync --locked
      - name: lint
        run: uv run ruff check .
