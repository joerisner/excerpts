name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: install project
        run: uv sync --locked
      - name: lint
        run: uv run ruff check .

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: install project
        run: uv sync --locked
      - name: format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: install project
        run: uv sync --locked
      - name: typecheck
        run: uv run ty check .

  tf-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: check terraform format
        run: terraform -chdir=infra fmt -check

  tf-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: initialize terraform
        run: terraform -chdir=infra init
      - name: validate terraform configuration
        run: terraform -chdir=infra validate

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: install project
        run: uv sync --locked
      - run: docker compose up -d db-test
      - name: pytest
        run: uv run pytest

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: trufflehog secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  snyk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: snyk/actions/setup@master
      - uses: astral-sh/setup-uv@v9.0.0
      - name: generate SBOM with uv
        run: uv export --format cyclonedx1.5 > sbom.json
      - name: snyk vulnerability scan (SCA)
        run: snyk sbom test --file=sbom.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: snyk source code scan (SAST)
        run: snyk code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: snyk iac test (SAST)
        run: snyk iac test ./infra
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: checkov IAC and SCA check
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          skip_check: CKV_GIT_1 # Repo is intentionally public, not private.
