services:
  db-dev:
    image: postgres:18-alpine
    container_name: excerpts_db-dev
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: password
      POSTGRES_DB: excerpts_dev
    restart: on-failure

  db-test:
    image: postgres:18-alpine
    container_name: excerpts_db-test
    ports:
      # Map port 5433 to not conflict with running dev container
      - 5433:5432
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: password
      POSTGRES_DB: excerpts_test
    restart: on-failure
