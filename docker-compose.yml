services:
  db-dev:
    image: postgres:18-alpine
    container_name: excerpts-db-dev
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dev
    restart: on-failure

  db-test:
    image: postgres:18-alpine
    container_name: excerpts-db-test
    ports:
      # Map port 5433 to not conflict with running dev container
      - 5433:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
    restart: on-failure
